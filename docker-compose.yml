version: "3.9"

services:
  text2mp3:
    build: .
    container_name: text2mp3
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # 持久化生成的音频文件
      - ./output:/app/output
      # 持久化克隆音色数据
      - ./cloned_voices:/app/cloned_voices
      # 持久化历史记录
      - ./history.json:/app/history.json
    restart: unless-stopped
