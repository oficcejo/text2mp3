version: "3.9"

services:
  text2mp3:
    build: .
    container_name: text2mp3
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./cloned_voices:/app/cloned_voices
      - ./history.json:/app/history.json
      - ./jobs:/app/jobs
    restart: unless-stopped
